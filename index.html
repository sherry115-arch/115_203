<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>雅菁老師｜星際教學站</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    :root{--ink:#edf1ff;--dim:#aeb8e9;--violet:#8d73ff;--pink:#ff74b5;--mint:#5ee7d2;--yellow:#ffd968;--nav:#101839}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#080d25;font-family:"Noto Sans TC",sans-serif;overflow-x:hidden}#stars{position:fixed;inset:0;z-index:-2;width:100%;height:100%;background:radial-gradient(ellipse at 20% 0%,#29326c 0,transparent 40%),radial-gradient(ellipse at 90% 70%,#35235d 0,transparent 36%),#080d25}.nebula{position:fixed;width:40vmax;height:40vmax;border-radius:50%;filter:blur(80px);opacity:.16;z-index:-1;background:#bc70ff;right:-15vmax;top:26vmax}
    .wrap{width:min(1120px,calc(100% - 32px));margin:auto}nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;position:relative;z-index:2}.brand{font-family:Fredoka,"Noto Sans TC";font-size:21px;font-weight:600;letter-spacing:.5px}.brand span{color:var(--yellow)}.navlinks{display:flex;gap:16px}.navlinks a{color:var(--dim);text-decoration:none;font-size:14px}.navlinks a:hover{color:white}
    .hero{position:relative;padding:70px 0 58px;min-height:475px;display:grid;align-items:center}.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid #8894e850;border-radius:999px;color:#cbd2ff;background:#24306070;font-size:13px}.hero h1{font-size:clamp(43px,8vw,82px);line-height:1.16;letter-spacing:-2px;margin:20px 0 16px;font-weight:900}.hero h1 em{font-style:normal;background:linear-gradient(90deg,#fff,#a5eaff,#ffb5d7);background-clip:text;color:transparent}.hero p{color:var(--dim);line-height:1.9;font-size:17px;max-width:520px}.cta{display:flex;gap:11px;flex-wrap:wrap;margin-top:28px}.btn{border:0;border-radius:14px;padding:13px 18px;background:linear-gradient(110deg,var(--pink),var(--violet));color:white;font:700 15px inherit;text-decoration:none;cursor:pointer;box-shadow:0 8px 21px #946ee943;transition:.2s}.btn:hover{transform:translateY(-3px);filter:brightness(1.1)}.btn.ghost{background:#18224a;color:#dbe1ff;border:1px solid #6977bb54;box-shadow:none}.orbit{position:absolute;width:360px;height:360px;right:5%;top:65px;border:1px solid #91a6ff35;border-radius:50%;transform:rotate(-20deg)}.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;background:linear-gradient(135deg,#ffdf79,#ff75ba);box-shadow:0 0 45px #ff92c880}.orbit:before{width:88px;height:88px;top:23px;left:55px}.orbit:after{width:25px;height:25px;right:17px;bottom:74px}.ship{position:absolute;right:10%;top:115px;font-size:73px;filter:drop-shadow(0 10px 12px #5a60f388);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-13px) rotate(-5deg)}}
    .mission{padding:19px 22px;display:flex;align-items:center;gap:16px;border:1px solid #7585e64d;background:linear-gradient(100deg,#1b2453c9,#19264a94);border-radius:22px;box-shadow:0 15px 35px #0002}.mission .orb{width:47px;height:47px;display:grid;place-items:center;border-radius:16px;background:#293368;font-size:25px}.mission p{margin:2px 0 0;color:var(--dim);font-size:14px}.mission b{font-size:16px}.mission button{margin-left:auto}
    section{padding:64px 0}.head{text-align:center;margin-bottom:30px}.head small{color:var(--mint);letter-spacing:1px;font-weight:700}.head h2{font-size:34px;margin:8px 0}.head p{color:var(--dim);margin:0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.portal{position:relative;isolation:isolate;min-height:244px;padding:21px;border-radius:24px;overflow:hidden;text-decoration:none;color:white;border:1px solid #94a1ee3d;background:linear-gradient(145deg,#222e62,#151d43);transition:.25s}.portal:hover{transform:translateY(-8px);border-color:#d8d7ff99;box-shadow:0 20px 35px #0004}.portal:after{content:"";position:absolute;width:135px;height:135px;right:-28px;bottom:-30px;border-radius:50%;background:var(--c);opacity:.22;filter:blur(3px);z-index:-1}.portal .icon{font-size:39px;display:block;margin-bottom:34px}.portal b{font-size:18px}.portal p{font-size:13px;line-height:1.6;color:#d3dafd;margin:8px 0}.portal .go{font-size:12px;color:var(--yellow);font-weight:bold}.portal:nth-child(1){--c:#7e96ff}.portal:nth-child(2){--c:#ff7fc1}.portal:nth-child(3){--c:#6ce6d2}.portal:nth-child(4){--c:#ffd86b}.portal:nth-child(5){--c:#a97dfd}
    .interact{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{padding:28px;border-radius:25px;border:1px solid #7b88d442;background:#151d43ba}.panel h3{margin:0 0 8px}.panel p{color:var(--dim);line-height:1.8;font-size:14px}.quote{min-height:118px;padding:18px;border-radius:17px;background:linear-gradient(120deg,#2b3066,#423267);font-size:18px;line-height:1.75}.quote span{display:block;color:#9ea9e5;font-size:12px;margin-top:9px}.checklist{display:grid;gap:9px}.check{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;background:#20295a;cursor:pointer;user-select:none}.check input{accent-color:var(--mint);width:17px;height:17px}.progress{height:11px;border-radius:30px;background:#2a3262;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--mint),#95bfff);border-radius:inherit;transition:.4s}.launch{display:flex;align-items:center;gap:14px}.launch .bigbtn{width:64px;height:64px;border:0;border-radius:20px;background:linear-gradient(135deg,#ff82b7,#9576f5);font-size:29px;cursor:pointer}.launch #launchText{font-weight:bold}.launch #launchText small{display:block;color:var(--dim);font-weight:normal;margin-top:5px}
    footer{text-align:center;color:#8d97cc;padding:35px 0 48px;font-size:13px}.toast{position:fixed;left:50%;bottom:25px;z-index:10;transform:translate(-50%,120px);background:#fff;color:#29325d;padding:13px 19px;border-radius:99px;font-weight:bold;box-shadow:0 12px 30px #0005;transition:.35s}.toast.show{transform:translate(-50%,0)}.spark{position:fixed;z-index:20;pointer-events:none;font-size:20px;animation:burst .8s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(270deg);opacity:0}}
    @media(max-width:820px){.orbit,.ship{opacity:.22;right:-60px}.grid{grid-template-columns:repeat(2,1fr)}.portal:last-child{grid-column:span 2}.interact{grid-template-columns:1fr}.hero{min-height:430px}.navlinks{display:none}}@media(max-width:430px){.grid{grid-template-columns:1fr}.portal:last-child{grid-column:auto}.hero h1{letter-spacing:-1px}.body{padding:0}.mission{align-items:flex-start}.mission button{margin-left:0}.mission{flex-wrap:wrap}}
  .sublist{display:none;margin-left:15px;}
</style>
<script>
// Collapsible sidebar navigation
document.querySelectorAll('.collapsible > span').forEach(span=>{
  span.style.cursor='pointer';
  span.addEventListener('click',()=>{
    const sub = span.nextElementSibling;
    if(sub){
      sub.style.display = (sub.style.display==='block') ? 'none' : 'block';
    }
  });
});
// Smooth scrolling for internal links
document.querySelectorAll('a[href^="#"]').forEach(a=>{
  a.addEventListener('click',e=>{
    e.preventDefault();
    const target = document.querySelector(a.getAttribute('href'));
    if(target){
      target.scrollIntoView({behavior:'smooth'});
    }
  });
});
</script>
<script>
</head>
<body>
  <canvas id="stars"></canvas><div class="nebula"></div>
  <div class="wrap"><aside class="sidebar"><h3>導覽</h3><ul class="nav-list"><li class="collapsible"><span>任務星球</span><ul class="sublist"><li><a href="#portals">星球傳送門</a></li></ul></li><li class="collapsible"><span>星際補給站</span><ul class="sublist"><li><a href="#boost">補給站</a></li></ul></li></ul></aside>
    <nav><div class="brand">🚀 雅菁老師的<span>教學宇宙</span></div><div class="navlinks"><a href="#portals">任務星球</a><a href="#boost">星際補給站</a></div></nav>
    <header class="hero">
      <div><span class="eyebrow">✦ Welcome aboard, young explorers!</span><h1>一起探索、<br><em>快樂學習。</em></h1><p>這裡是雅菁老師的教學宇宙。最新消息、親師資源、轉知公告與線上朗讀任務，都藏在一顆顆發亮的星球裡。</p><div class="cta"><a class="btn" href="#portals">開啟星際地圖 ✦</a><button class="btn ghost" id="surprise">抽一張學習能量卡</button></div></div><div class="orbit"></div><div class="ship">🛸</div>
    </header>
    <div class="mission"><div class="orb">📡</div><div><b>今日星際任務</b><p>準備好了嗎？用最棒的聲音完成今天的朗讀挑戰！</p></div><a class="btn" href="https://reurl.cc/jV68bZ" target="_blank" rel="noopener">前往錄音</a></div>
    <section id="portals"><div class="head"><small>✦ GALAXY PORTALS</small><h2>任務星球傳送門</h2><p>點一顆星球，就能立即抵達需要的學習資源。</p></div><div class="grid">
      <a class="portal" href="https://reurl.cc/Z82GEa" target="_blank" rel="noopener"><span class="icon">🏫</span><b>校網總部</b><p>掌握學校最新公告、行事與重要訊息。</p><span class="go">啟動傳送門 →</span></a>
      <a class="portal" href="https://reurl.cc/nxpoxd" target="_blank" rel="noopener"><span class="icon">📣</span><b>學校 FB 星球</b><p>看見校園活動與精彩的學習日常。</p><span class="go">啟動傳送門 →</span></a>
      <a class="portal" href="https://reurl.cc/eQpExx" target="_blank" rel="noopener"><span class="icon">🤝</span><b>親師教養基地</b><p>一起交流、陪伴孩子成長的實用分享。</p><span class="go">啟動傳送門 →</span></a>
      <a class="portal" href="https://reurl.cc/qap1Dn" target="_blank" rel="noopener"><span class="icon">📨</span><b>轉知訊息艙</b><p>重要通知、活動與學習機會都在這裡。</p><span class="go">啟動傳送門 →</span></a>
      <a class="portal" href="https://reurl.cc/jV68bZ" target="_blank" rel="noopener"><span class="icon">🎙️</span><b>線上錄音站</b><p>錄下清楚又自信的聲音，完成朗讀任務。</p><span class="go">啟動傳送門 →</span></a>
    </div></section>
    <section id="boost"><div class="head"><small>✦ MISSION BOOSTER</small><h2>星際補給站</h2><p>完成小小準備，讓今天的學習能量滿格！</p></div><div class="interact">
      <div class="panel"><h3>🪐 出發前的小檢查</h3><p>勾選完成的項目，看看你的準備進度。</p><div class="checklist" id="list"><label class="check"><input type="checkbox"> 我有準備好學用品</label><label class="check"><input type="checkbox"> 我願意專心聽與勇敢說</label><label class="check"><input type="checkbox"> 我會用有禮貌的話和人相處</label></div><div class="progress"><div class="bar" id="bar"></div></div><p id="progressText">0 / 3 顆準備星星</p></div>
      <div class="panel"><h3>✨ 星際能量發射器</h3><p>按下按鈕，讓今天的學習旅程正式起飛。</p><div class="quote" id="quote">「每一次認真練習，都在讓自己更靠近目標。」<span>— 今日學習能量</span></div><div class="launch" style="margin-top:18px"><button class="bigbtn" id="launch">🚀</button><div id="launchText">等待發射中<small>按下火箭，接收今日的學習祝福！</small></div></div></div>
    </div></section>
    <footer>© 雅菁老師的教學宇宙 · 讓每一次學習，都成為閃亮的探索。</footer>
  </div><div class="toast" id="toast"></div>
  <script>
    const canvas=document.querySelector('#stars'),ctx=canvas.getContext('2d');let dots=[];function resize(){canvas.width=innerWidth;canvas.height=innerHeight;dots=Array.from({length:Math.floor(innerWidth/12)},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.7+.2,a:Math.random()*.8+.2,v:Math.random()*.25+.05}))}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);dots.forEach(s=>{s.y-=s.v;if(s.y<0)s.y=canvas.height;ctx.fillStyle='rgba(255,255,255,'+s.a+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});requestAnimationFrame(draw)}addEventListener('resize',resize);resize();draw();
    const lines=['今天的你，比昨天更勇敢一點點！','專心聽、認真想、勇敢說，你就是學習小隊長！','讀錯不是失敗，是找到下一次會更好的地方。','慢慢來也沒關係，每一步都算數。','你的好奇心，就是最厲害的星際引擎！'];const toast=document.querySelector('#toast');function show(t){toast.textContent='✨ '+t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2800)}document.querySelector('#surprise').onclick=()=>show(lines[Math.floor(Math.random()*lines.length)]);
    const checks=[...document.querySelectorAll('#list input')],bar=document.querySelector('#bar'),pt=document.querySelector('#progressText');checks.forEach(c=>c.onchange=()=>{let n=checks.filter(x=>x.checked).length;bar.style.width=n/3*100+'%';pt.textContent=n+' / 3 顆準備星星';if(n===3)show('三顆準備星星到手，今天一定行！')});
    document.querySelector('#launch').onclick=e=>{const line=lines[Math.floor(Math.random()*lines.length)];document.querySelector('#quote').innerHTML='「'+line+'」<span>— 雅菁老師送給你的學習祝福</span>';document.querySelector('#launchText').innerHTML='發射成功！<small>把這份能量帶進今天的學習吧。</small>';for(let i=0;i<20;i++){let s=document.createElement('i');s.className='spark';s.textContent=['✨','⭐','💫'][i%3];s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.style.setProperty('--x',(Math.random()*240-120)+'px');s.style.setProperty('--y',(Math.random()*-230-20)+'px');document.body.append(s);setTimeout(()=>s.remove(),850)}};
  </script>
</body></html>
